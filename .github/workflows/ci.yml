name: CI-CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  deploy:
    needs: build-test
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exp8-cicd-demo:${{ github.sha }}

      - name: Update Kubernetes deployment
        run: kubectl set image deployment/mywebapp-deployment mywebapp=${{ secrets.DOCKER_USERNAME }}/exp8-cicd-demo:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/mywebapp-deployment --timeout=180s
